table: >
  One row per payment attempt processed by MoMA's standalone payment microservice ("payment
  service"), which wraps Adyen for both in-person terminal (POS / SaleToPOI) and online card
  payments made through membership.moma.org checkout flows. This table is owned by the EXTERNAL
  payment service, not the Rails app — there is no ActiveRecord model for it; the Rails app only
  talks to it over HTTP (app/services/payment_services) and receives status callbacks. In Postgres
  it lives in the payment_service schema as payment_service.payments; in BigQuery the schema prefix
  is flattened into the table name payment_service_payments. Grain: one payment request (refunds
  live in a separate payment_service.refunds table not synced here).
columns:
  id: >
    Primary key. UUID of the payment, stored as STRING, generated by the payment service. The Rails
    app stores this value on payment_details.uuid, so join moma_apps.payment_details.uuid =
    payment_service_payments.id to connect a payment to its cart/order. Likely also the value
    carried in ticketing_orders.payment_id.
  amount: >
    INTEGER, nullable. Payment amount in DOLLARS, not cents — terminal-style requests send
    amount_in_cents / 100.0 as "amount". Because the column is an integer, fractional dollar amounts
    may be truncated; prefer amount_in_cents for arithmetic. Likely NULL for online payments, which
    send cents instead.
  external_reference: >
    STRING, nullable. Reference identifying the transaction in the external payment processor.
    Likely the Adyen PSP reference; the Rails app reconciles payments against Salesforce Heroku
    transactions using uuid/psp_reference values.
  currency: >
    STRING ISO 4217 currency code. The Rails client hardcodes 'USD' as the default for all request
    types.
  created_at: >
    TIMESTAMP. When the payment row was created in the payment service. Used as the MERGE partition
    key by the sync pipeline.
  updated_at: >
    TIMESTAMP. Last modification time in the payment service; drives the incremental sync watermark.
  status: >
    STRING payment lifecycle status, lowercase. Vocabulary known to the Rails client
    (PaymentServices::Response): 'pending', 'received', 'confirmed', 'completed', 'cancelled',
    'rejected' are statuses observed in service payloads. The remaining Response constants
    ('unauthorized', 'invalid', 'timed_out', 'unknown_error') are synthesized client-side and Likely
    never stored here. 'completed' (with 'confirmed' treated as completed) indicates a successful
    charge.
  terminal_id: >
    STRING, nullable. Identifier of the Adyen POS terminal that took the payment for in-person
    transactions. NULL for online (e-commerce) payments.
  last_digits: >
    STRING, nullable. Last digits (typically last 4) of the payment card used. Card-display field,
    PCI-safe.
  card_token: >
    STRING, nullable. Tokenized card reference returned by the processor. Likely the Adyen
    stored-payment-method token used for card-on-file. References the EXTERNAL processor, not a
    local table.
  shopper_reference: >
    STRING, nullable. Adyen shopperReference: a stable per-customer token the Rails app generates
    from the shopper's email and sends with online payments to enable card-on-file/recurring
    charges. Groups payments by shopper across orders; references the EXTERNAL processor's shopper
    identity.
  card_brand: >
    STRING, nullable. Card scheme/brand of the payment card as reported by the processor (value set
    comes from Adyen and is not enumerated in the Rails repo).
  amount_in_cents: >
    INTEGER, nullable. Payment amount in integer CENTS (USD). Online payment requests send this
    field directly. This is the reliable money column: dollars = amount_in_cents / 100. When both
    amount and amount_in_cents are populated they describe the same charge in different units.
  first_name: >
    STRING, nullable. Shopper first name sent by the Rails app with the payment request. PII.
  last_name: >
    STRING, nullable. Shopper last name sent with the payment request. PII.
  email: >
    STRING, nullable. Shopper email sent with the payment request. PII; useful for joining to
    moma_apps.users/contacts by email, though not a formal FK.
  ip_address: >
    STRING, nullable. Client IP address captured at checkout and forwarded for fraud/risk screening.
    PII.
  additional_risk_data: >
    JSON, nullable. Extra risk-assessment payload the Rails app forwards for online payments
    (device/browser fingerprint style data) for the processor's fraud checks. The sync coalesces SQL
    NULL to an empty JSON object, so expect '{}' rather than NULL.
  raw_payment_data: >
    JSON. Raw response payload from the payment processor. For terminal payments this contains the
    Adyen Terminal API structure (SaleToPOIResponse.PaymentResponse with Result/ErrorCondition,
    which the Rails callback inspects to distinguish shopper-aborted from rejected payments).
    Defaults to '{}' and the sync coalesces NULL to '{}'.
