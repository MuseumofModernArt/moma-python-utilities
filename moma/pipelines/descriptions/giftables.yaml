table: >
  One row per gift-membership voucher code ("gift code"). Grain: a single redeemable code in the
  format XXXX-XXXX-XXXX (12 alphanumeric chars from 1-9/A-Z, excluding 0 and O). Giftables are
  created two ways: individually when a customer buys a gift membership online
  (LineItems::GiftMembershipPurchase creates one per recipient), or in bulk from a
  gift_membership_batches row (admin-generated packets). Lifecycle is an AASM state machine on
  `status` with per-state timestamps: purchase sets balance and expiry, the giftee activates the
  code via the gift-activation page, and redemption consumes it into a membership via a
  LineItems::GiftMembershipRedemption line item. Owned by the membership domain of the Rails app.
  Rows are never deleted by the BigQuery sync.
columns:
  id: >
    Primary key (INT64, BIGINT surrogate). Part of the pipeline MERGE key (id + created_at).
  status: >
    AASM state of the voucher. Values: 'initial' (just created, pre-purchase), 'generated'
    (created as part of an admin batch, not yet sold), 'purchased' (paid for; balance and
    expires_at assigned), 'activated' (giftee opened/started activation), 'redeemed' (converted
    into a membership), 'expired' (past expiry or force-expired), 'refunded' (purchase refunded).
  gift_code: >
    The voucher code 'XXXX-XXXX-XXXX' (unique, NOT NULL; 12 alphanumeric chars plus 2 dashes,
    alphabet excludes 0 and O). This is what the giftee types in to activate/redeem.
  expires_at: >
    Timestamp after which the code can no longer be redeemed. Set at purchase (from the purchase
    options) or inherited from the parent batch's expires_at; overwritten with the current time
    when the code is force-expired. Nullable.
  purchased_at: >
    Timestamp the code entered the 'purchased' state (AASM auto-timestamp). NULL if never
    purchased.
  activated_at: >
    Timestamp the code entered the 'activated' state (giftee began activation). NULL if never
    activated.
  expired_at: >
    Timestamp the code entered the 'expired' state. NULL if never expired.
  redeemed_at: >
    Timestamp the code entered the 'redeemed' state (converted to a membership). NULL if never
    redeemed.
  refunded_at: >
    Timestamp the code entered the 'refunded' state. NULL if never refunded.
  balance_in_cents: >
    Monetary value of the voucher in integer USD cents, set from the purchase's amount_in_cents at
    purchase time. Defaults to 0 (e.g. batch codes before sale). NOT NULL.
  purchased_by_id: >
    Foreign key -> line_items.id (declared): the LineItems::GiftMembershipPurchase line item that
    bought this code. Nullable; required by the app unless the code belongs to a
    gift_membership_batch (batch codes have no per-code purchase line item).
  redeemed_by_id: >
    Foreign key -> line_items.id (declared): the LineItems::GiftMembershipRedemption line item that
    consumed the code into a membership. NULL until redeemed.
  created_at: >
    Row creation timestamp (Rails-managed, NOT NULL). Part of the BigQuery MERGE key with id.
  updated_at: >
    Last row update timestamp (Rails-managed, NOT NULL); drives incremental sync.
  delivery_date: >
    Date the gifter chose for the gift email to be delivered to the giftee (copied from the
    purchase line item's gift_delivery_date; constrained at purchase to between today and end of
    next month). NULL for batch-generated codes.
  gifter_name: >
    Display name of the purchaser/giver, copied from the purchase line item at purchase (or from
    the lobby sale). Nullable.
  giftee_name: >
    Display name of the intended recipient, copied at purchase. Nullable.
  gifter_email: >
    Email of the purchaser/giver. Nullable.
  giftee_email: >
    Email of the intended recipient (where the gift-code email is sent). Nullable.
  gift_membership_batch_id: >
    Foreign key -> gift_membership_batches.id (declared): parent batch when the code was
    bulk-generated by an admin. NULL for codes created by individual online purchases.
